<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Rendyn login code</title></head>
  <body style="margin:0;background:#f7f5fa;color:#282131;font-family:Arial,sans-serif;padding:40px 20px">
    <div style="max-width:420px;margin:0 auto;background:#fff;border-radius:20px;padding:32px">
      <p style="margin:0 0 28px;font-size:16px;font-weight:600">Rendyn</p>
      <h1 style="font-size:24px;letter-spacing:-0.6px;font-weight:500;margin:0 0 16px">Your login code</h1>
      <p style="font-size:15px;line-height:1.6;color:#716879">Enter this code in Rendyn to log in.</p>
      <p style="padding:20px 12px;background:#f4f0f8;border-radius:12px;font-size:32px;letter-spacing:8px;text-align:center;font-weight:600">{{ .Token }}</p>
      <p style="font-size:13px;line-height:1.6;color:#716879">Keep this code private. If you didn’t request it, you can ignore this email.</p>
    </div>
  </body>
</html>
